# extlinux.conf for RAUC A/B setup
#
# A/B boot configuration (U-Boot env location and slot offsets) is handled
# by lk2nd at compile time. This file only defines boot labels.
#
# lk2nd selects the label matching the active slot (_A or _B suffix)
# based on BOOT_ORDER from the U-Boot environment.

timeout 1
menu title Lemon RAUC AB
default linux

label linux_A
	kernel /zImage
	fdt /qcom-msm8974pro-fairphone-fp2.dtb
	initrd /initramfs.gz
	append earlycon=msm_serial_dm,0xf991e000 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 bootpart=/dev/mmcblk0p20p1 rootfs=/dev/mmcblk0p20p5 rauc.slot=A

label linux_B
	kernel /zImage
	fdt /qcom-msm8974pro-fairphone-fp2.dtb
	initrd /initramfs.gz
	append earlycon=msm_serial_dm,0xf991e000 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 bootpart=/dev/mmcblk0p20p2 rootfs=/dev/mmcblk0p20p6 rauc.slot=B
