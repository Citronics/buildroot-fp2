[system]
compatible=lemon-rauc-v1
# Using custom bootloader integration with lk2nd + U-Boot env support
# lk2nd reads U-Boot environment variables from userdata partition
bootloader=custom
statusfile=/data/rauc/slot.status
bundle-formats=plain

[keyring]
path=/etc/rauc/ca.cert.pem

# Custom bootloader interface configuration
[handlers]
bootloader-custom-backend=/usr/lib/rauc/bootloader-custom-backend.sh

# Slot configuration for A/B partitioning
# lk2nd will use BOOT_ORDER to determine which slot to boot

[slot.rootfs.0]
device=/dev/mmcblk0p20p5
type=ext4
bootname=A
readonly=false

[slot.rootfs.1]
device=/dev/mmcblk0p20p6
type=ext4
bootname=B
readonly=false

[slot.boot.0]
device=/dev/mmcblk0p20p1
type=raw
parent=rootfs.0
install-same=true

[slot.boot.1]
device=/dev/mmcblk0p20p2
type=raw
parent=rootfs.1
install-same=true
