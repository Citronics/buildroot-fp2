# genimage configuration for RAUC A/B partitioning on Lemon device
# This configuration creates an image with dual boot and dual rootfs partitions
# to enable robust A/B updates using RAUC
#
# IMPORTANT: Partition labels (boot-a, boot-b) must match the names configured
# in extlinux.conf via rauc_boot_part_a and rauc_boot_part_b directives.
# lk2nd uses these labels to locate the correct boot partition based on BOOT_ORDER.
#
# U-Boot Environment Layout:
# The U-Boot environment is stored at offset 0x10000 (64KB) with size 0x20000 (128KB).
# This space is reserved before the first partition by setting partition-table = false
# and manually placing partitions with offset directives.

## NOTE:
## Boot and rootfs images are pre-built by post-image hooks and must NOT be
## regenerated here, otherwise they get overwritten with empty filesystems.
## Therefore, we only reference them from partitions below and do not declare
## separate image blocks for boot-A.ext2/boot-B.ext2/rootfs-a.ext4/rootfs-b.ext4.

image data.ext4 {
  ext4 {
    label = "data"
  }
  size = 512M
}

image sdcard.img {
  hdimage {
    partition-table-type = "mbr"
    gpt = false
  }

  # Reserve space for U-Boot environment before first partition
  # U-Boot env: offset 0x10000 (64KB), size 0x20000 (128KB)
  # First partition starts at 0x100000 (1MB) to leave plenty of space

  partition boot-a {
    image = "boot-A.ext2"
    offset = 1M
    size = 64M
  }

  partition boot-b {
    image = "boot-B.ext2"
    size = 64M
  }

  # Dummy primary to force the remaining partitions into an extended partition
  partition filler {
    partition-type = 0x83
    size = 1M
  }

  partition rootfs-a {
    image = "rootfs-A.ext4"
    size = 300M
  }

  partition rootfs-b {
    image = "rootfs-B.ext4"
    size = 300M
  }

  partition data {
    image = "data.ext4"
  }
}
