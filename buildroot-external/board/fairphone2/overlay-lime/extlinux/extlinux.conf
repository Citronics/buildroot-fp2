timeout 1
default citronics612rig

# Lime image: the carrier board entry is the default; the phone entry stays
# available. See overlay-612/extlinux/extlinux.conf for both entries' notes.
label citronics612rig
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2-rig.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm lk2nd.pass-ramoops cpufreq.default_governor=schedutil

# Phone (display on, full frequency range, radios enabled).
label citronics612
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm lk2nd.pass-ramoops
