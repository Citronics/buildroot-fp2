timeout 1
default citronics612rig

# Soak image for the carrier board: boots the carrier device tree unattended.
# schedutil is named because the kernel default is conservative, and every
# earlier soak ran with schedutil. panic=10 brings a panicked board back by
# itself; the boot registry then shows a boot without a clean stop.
label citronics612rig
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2-rig.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm cpufreq.default_governor=schedutil panic=10

# Phone (display on), not the default.
label citronics612
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm cpufreq.default_governor=schedutil panic=10
