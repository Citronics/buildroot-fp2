timeout 1
default citronics612

# 6.12 LTS baseline: drm/msm drives the panel through the vram carveout
# (msm.vram), the mechanism 6.18 removed. lk2nd.pass-ramoops keeps the
# silent-reset evidence chain; reboot=warm makes reboot-mode reach fastboot.
label citronics612
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm lk2nd.pass-ramoops
