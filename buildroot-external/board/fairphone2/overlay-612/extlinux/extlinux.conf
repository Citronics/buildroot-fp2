timeout 1
default citronics612

# 6.12 LTS baseline: drm/msm drives the panel through the vram carveout
# (msm.vram), the mechanism 6.18 removed. lk2nd.pass-ramoops keeps the
# silent-reset evidence chain; reboot=warm makes reboot-mode reach fastboot.
#
# TWO LABELS, ONE IMAGE, PHONE-SAFE BY DEFAULT.  The default boots the phone
# configuration, so an image flashed to a real Fairphone 2 behaves normally even
# if it was built during rig work.  The rig entry exists in every image but is
# never chosen by accident: rig/mkrigimg.sh produces a rig-flavoured copy of
# sdcard.img by flipping the default label, and that copy is what gets flashed
# to the fixture.  Relying on a human to flip this line back was a footgun.

# Carrier rig (no battery pack; fed from the carrier's supply on the battery
# pins, with the host cable's VBUS also present on USB_IN).
#
# powersave at boot is a measured requirement of THIS supply, not a workaround.
#
# In debug mode the board is powered through the PMIC's USB input path from a
# host port, and that port collapses under our boot load: the charger reported
# "input collapsed at 900000 uA (hw 900000 uA)" and the board reset with UVLO.
# The ceiling is not the issue - mainline has 1.5 A programmed too and boots
# fine here - the DRAW is: mainline runs fixed 384/960 MHz through bring-up
# while we online four cores and let the governor ramp them during the udev
# storm.  Starting the policy at the lowest OPP removes that spike; rig-envelope
# hands over to schedutil once userspace is quiet, so DVFS is still exercised.
#
# maxcpus=1 is deliberately NOT here: all four cores at 300 MHz are affordable,
# and hiding cores would remove them from validation.  What was fixed in the
# driver (arming the input path with no battery, and then leaving the configured
# input limit alone, exactly as mainline does) is what made a clean boot possible.
#
# Radios autoload normally again.  They were briefly held back with
# modprobe.blacklist because udev bringing all three up during the boot storm
# reset the fixture - but that was the input-floor fold-back (fixed by the 4.3 V
# qcom,minimum-input-voltage in the rig DTB), not a power budget.  Re-testing the
# configuration that previously failed is the point, so nothing is staged here;
# rig-envelope's sequenced loader stays available via RIG_LOAD_RADIOS for the day
# a genuine concurrency limit turns up.
#
# Load policy now lives entirely in rig-envelope, which caps scaling_max_freq
# from the core count and sheds on an input collapse or a USBIN sag - adjustable
# without a reflash, unlike a cmdline.
label citronics612rig
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2-rig.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm lk2nd.pass-ramoops cpufreq.default_governor=powersave

# Phone (display on, full frequency range, radios enabled).
label citronics612
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm lk2nd.pass-ramoops
