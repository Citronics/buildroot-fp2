# Carrier-rig CPU envelope.  The presence of this file is what marks an image
# as a rig image: S89rig-envelope skips itself entirely without it, so a phone
# built from the same tree keeps its full frequency range.

RIG_GOVERNOR=schedutil

# Power-aware ceilings, derived from the input budget rather than guessed.
#
# Budget on a 1.5 A / 5 V input: 7.5 W at the connector, less cable loss and
# ~85% PMIC conversion gives ~6.0 W to the loads; the platform floor (DDR,
# eMMC, USB, clocks, PMIC) is ~1.4 W, leaving ~4.5 W for CPU+L2.  Per-core
# estimates: 1497.6 MHz ~0.85 W, 1728 MHz ~1.06 W, 1958.4 MHz ~1.35 W,
# 2265.6 MHz ~1.71 W.  So 4x1497.6 (~3.4 W) and 3x1728 (~3.2 W) fit with margin
# while 4x1958.4 (~5.8 W) does not, and one or two cores can run the full range.
#
# IMPORTANT: measured 2026-08-04, the thermal governor clamps sustained
# four-core load to ~1.0-1.2 GHz on its own (76 C, cpufreq cooling at 6/13), so
# these caps rarely bind today.  That is a side effect of this fixture's
# cooling, NOT a guarantee: with better cooling the cores would sustain higher
# OPPs and the input budget would become the binding limit instead.  Raise these
# only together with the supply - the rig DTB asks the PMIC for its 2.5 A
# maximum (12.5 W, ~8.6 W for CPU+L2), which covers four cores at the top OPP,
# but only if the source can actually deliver it.
RIG_CAP_1CPU=2265600
RIG_CAP_2CPU=2265600
RIG_CAP_3CPU=1728000
RIG_CAP_4CPU=1497600

# Absolute ceiling regardless of core count; empty means "no extra limit".
# An earlier 652800 here came from a budget computed for a 0.9 A feed and was
# refuted by walking the ceiling to 2265600 under four-core load with no
# collapse.  Set a value only to pin the rig deliberately for an experiment.
RIG_MAX_KHZ=

# Supply-voltage thresholds, applied to whichever channel the service picks
# (USBIN on this fixture - see the rig DTB for why VBAT_SNS and the IADC are
# useless without a cell).  These are feed-voltage figures, not VPH: a USB
# source sagging below ~4.6 V is already current-limiting, and 4.85 V is a
# confident recovery.  UVLO itself is a VPH event at ~2.9-3.0 V, far too late
# to react to.
RIG_VPH_LOW_UV=4600000
RIG_VPH_OK_UV=4850000
RIG_POLL_S=1
RIG_RECOVER=20

# Sag trip, as a percentage below the measured idle baseline.  Without this the
# service treats any dip below the baseline as a sag (see the note in the script)
# and walks the ceiling to the floor.
RIG_SAG_PCT=8

# Last resort once the lowest OPP is not enough: shed cores instead of dying.
# Off by default - core count is a variable we want fixed while characterising.
RIG_ALLOW_OFFLINE=0

# Secondary-CPU bring-up.  The rig no longer boots with maxcpus=1 (that was a
# workaround for the starved input path, fixed in qcom_smbb), so all four cores
# are already online and this staging is a no-op unless someone re-adds it.
RIG_TARGET_CPUS=4
RIG_ONLINE_SETTLE_S=2
RIG_ONLINE_STAGGER_S=3
RIG_ONLINE_MIN_UV=4500000

# Deliberate, sequenced radio bring-up (the rig cmdline blacklists these from
# udev autoload).  Loading all of them concurrently during the boot storm is what
# this feed cannot carry; one at a time, after userspace settles, is affordable -
# and each step's supply cost gets logged, which is the point.
RIG_LOAD_RADIOS=0
RIG_RADIO_MODULES="qcom_q6v5_pas qcom_wcnss_pil wcn36xx qcom_q6v5_mss"
RIG_RADIO_SETTLE_S=8
