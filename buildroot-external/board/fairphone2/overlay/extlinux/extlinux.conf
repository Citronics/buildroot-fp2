timeout 1
default postmarketOS
menu title boot prev kernel

# lk2nd.pass-ramoops is REQUIRED: lk2nd relocates the DT ramoops node to its
# own scratch region, which is the only region its shell 'pstore' command and
# 'fastboot oem ramoops console' read back. Without the flag a silent reset
# leaves no bootloader-readable evidence. (lk2nd/ramoops/ramoops.c)
label postmarketOS
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2-headless.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel lk2nd.pass-ramoops
