timeout 1
default Buildroot
menu title boot prev kernel

label postmarketOS
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2-headless.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel
