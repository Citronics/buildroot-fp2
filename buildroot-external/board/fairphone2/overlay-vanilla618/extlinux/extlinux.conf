timeout 1
default vanilla
menu title boot prev kernel

# Vanilla-6.18.39 ground-truth variant: pure stable tree has no headless DTS,
# so boot the in-tree display DTB. lk2nd.pass-ramoops is REQUIRED here twice
# over: the vanilla DT has no ramoops node at all, and lk2nd both injects it
# and is the only thing that can read the region back pre-boot.
label vanilla
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel lk2nd.pass-ramoops
