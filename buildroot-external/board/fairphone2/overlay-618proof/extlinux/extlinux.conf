timeout 1
default proof618

# 6.18 display-through-SMMU test image, driven without physical access.
# watchdog.open_timeout: the kernel pets the watchdog U-Boot armed for that
# long, then stops unless userspace (deadman) has taken it over.
label proof618
	kernel /boot/zImage
	fdt /boot/qcom-msm8974pro-fairphone-fp2.dtb
	append earlycon=msm_serial_dm,0xf991e000 console=ttyMSM0,115200 console=tty1 fbcon=rotate:1 fbcon=font:TER16x32 root=/dev/mmcblk0p20 rootfstype=ext3 rw rootwait ignore_loglevel reboot=warm panic=5 watchdog.open_timeout=60
