# limeboard-ha: Home Assistant MQTT discovery for the Limeboard.
# Restart the service after a change.

# MQTT broker, e.g. the Mosquitto add-on of Home Assistant.
# The agent stays idle while MQTT_HOST is empty.
MQTT_HOST=""
MQTT_PORT=1883
MQTT_USER=""
MQTT_PASSWORD=""

# Home Assistant's discovery prefix
DISCOVERY_PREFIX=homeassistant

# Device id and name in Home Assistant (default: from the eMMC serial)
#NODE_ID=limeboard_0123abcd
#DEVICE_NAME="Limeboard 0123abcd"

# Seconds between system state updates (temperature, load, ...)
INTERVAL=30

# Seconds between updates of the phone's motion and light sensors. Each
# update is a state change for Home Assistant's recorder.
SENSOR_INTERVAL=1

# STM32 header pins (GPIO0..GPIO27) to expose, space separated.
# Outputs become switches, inputs binary sensors. Input modes: in,
# in_up (pull-up), in_down (pull-down).
MCU_OUTPUTS=""
MCU_INPUTS=""
MCU_INPUT_MODE=in

# Expose a button that presses the phone's power key (short press).
MCU_POWER_KEY=no
