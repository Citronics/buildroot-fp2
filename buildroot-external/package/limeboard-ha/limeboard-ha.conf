# limeboard-ha: Home Assistant MQTT discovery for the Limeboard.
# Restart the service after a change.

# MQTT broker, e.g. the Mosquitto add-on of Home Assistant.
# The agent stays idle while MQTT_HOST is empty.
MQTT_HOST=""
MQTT_PORT=1883
MQTT_USER=""
MQTT_PASSWORD=""

# Home Assistant's discovery prefix
DISCOVERY_PREFIX=homeassistant

# Seconds between system state updates (temperature, load, ...)
INTERVAL=30

# Seconds between updates of the phone's motion and light sensors
SENSOR_INTERVAL=1
