# The devices on the Limeboard header's SPI chip selects, as on a Raspberry
# Pi with spi0 and spi1 enabled:
#   spi0_cs0 CE0 GPIO8 (pin 24)   spi1_cs0 CE0 GPIO18 (pin 12)
#   spi0_cs1 CE1 GPIO7 (pin 26)   spi1_cs1 CE1 GPIO17 (pin 11)
#                                 spi1_cs2 CE2 GPIO16 (pin 36)
# Each is "<device>[,irq=<gpio>][,speed=<hz>][,mode=<0-3>]": "spidev" for
# /dev/spidevB.C (the default), a kernel driver's device name, or "none".
# irq= is a header GPIO (BCM number) wired to the chip's interrupt pin.
# A chip select's pin stays a plain GPIO until something uses it.
#
# Applied when the Limeboard I/O firmware appears. After a change, reboot, or
# run "udevadm control --reload" (for later resets of the STM32) and
# "rmmod spi_dln2; modprobe spi_dln2" (to apply it now).
#
# Needs a kernel whose spi-dln2 driver has these settings
# (modinfo -p spi_dln2 lists spi0_cs0 to spi1_cs3).
#
# Examples:
#options spi_dln2 spi0_cs1=mcp3008
#options spi_dln2 spi1_cs0=mcp2515,irq=25,speed=10000000 spi1_cs1=none spi1_cs2=none
