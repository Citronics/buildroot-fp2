# The devices on the Limeboard header's SPI chip selects: CE0 (GPIO8, pin 24)
# and CE1 (GPIO7, pin 26). Each is "<device>[,irq=<gpio>][,speed=<hz>]
# [,mode=<0-3>]": "spidev" for /dev/spidev0.0 and /dev/spidev0.1 (the
# default), a kernel driver's device name, or "none". irq= is a header GPIO
# (BCM number) wired to the chip's interrupt pin.
#
# Applied when the Limeboard I/O firmware appears. After a change, reboot, or
# run "udevadm control --reload" (for later resets of the STM32) and
# "rmmod spi_dln2; modprobe spi_dln2" (to apply it now).
#
# Needs a kernel whose spi-dln2 driver has these settings
# (modinfo -p spi_dln2 lists cs0-cs3).
#
# Examples:
#options spi_dln2 cs1=mcp3008
#options spi_dln2 cs0=mcp2515,irq=25,speed=10000000 cs1=none
